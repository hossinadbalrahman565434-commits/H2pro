name: بناء تطبيق H2pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: تفعيل AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties

      - name: بناء APK
        run: gradle :app:assembleDebug --stacktrace

      - name: التحقق من APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
