name: بناء ومعاينة تطبيق H2pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: تفعيل AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties

      - name: إصلاح صياغة Kotlin قبل البناء
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/h2pro/accounting/AccountingDb.kt')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('):List<String>=', '):List<String> ='),
              ('):List<Account>=', '):List<Account> ='),
          ]:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: بناء APK
        run: gradle :app:assembleDebug --stacktrace

      - name: التحقق من APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  preview:
    name: معاينة التطبيق قبل التثبيت
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: تنزيل APK
        uses: actions/download-artifact@v4
        with:
          name: H2pro-debug-apk
          path: apk

      - name: تشغيل محاكي Android والتقاط المعاينة
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am force-stop com.h2pro.accounting
            adb shell monkey -p com.h2pro.accounting 1
            sleep 5
            mkdir -p preview
            adb exec-out screencap -p > preview/01-login.png

            adb shell input tap 540 820 || true
            adb shell input text 1 || true
            adb shell input tap 540 900 || true
            adb shell input text 1234 || true
            adb shell input tap 540 980 || true
            sleep 3
            adb exec-out screencap -p > preview/02-home.png

      - name: رفع صور المعاينة
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-preview-screenshots
          path: preview/*.png
          if-no-files-found: error
