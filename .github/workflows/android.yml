name: بناء APK H2pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: h2pro-main-build
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK فقط
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v5
      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: بناء APK فقط بدون اختبارات
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain
      - name: التحقق من APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: رفع APK النهائي
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
