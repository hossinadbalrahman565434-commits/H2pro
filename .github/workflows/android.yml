name: بناء ومعاينة تطبيق H2pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: h2pro-main-build
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v5
      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: إصلاح صياغة Kotlin قبل البناء
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/h2pro/accounting/AccountingDb.kt')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('):List<String>=', '):List<String> ='),
              ('):List<Account>=', '):List<Account> ='),
          ]:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: بناء APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: التحقق من APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  accounting-test:
    name: اختبار الدورة المحاسبية
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v5
      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: اختبار الدورة على محاكي ثابت
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 4
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            set +e
            for attempt in 1 2; do
              echo "محاولة اختبار الدورة رقم $attempt"
              gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
              status=$?
              if [ "$status" -eq 0 ]; then
                exit 0
              fi
              echo "فشلت المحاولة $attempt، سيتم جمع سجل المحاكي وإعادة الاختبار إن أمكن"
              adb logcat -d -t 400 > "emulator-log-attempt-$attempt.txt" || true
              adb shell dumpsys activity processes > "activity-processes-attempt-$attempt.txt" || true
              sleep 5
            done
            exit 1
      - name: رفع تشخيص الاختبارات عند الفشل
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-test-diagnostics
          path: |
            emulator-log-attempt-*.txt
            activity-processes-attempt-*.txt
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

  preview:
    name: معاينة التطبيق قبل التثبيت
    needs: [build, accounting-test]
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v5
      - name: تنزيل APK
        uses: actions/download-artifact@v4
        with:
          name: H2pro-debug-apk
          path: apk
      - name: تشغيل محاكي Android والتقاط المعاينة
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 4
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r apk/app-debug.apk
            adb shell am force-stop com.h2pro.accounting
            adb shell monkey -p com.h2pro.accounting 1
            sleep 5
            mkdir -p preview
            adb exec-out screencap -p > preview/01-login.png
            adb shell input tap 540 820 || true
            adb shell input text 1 || true
            adb shell input tap 540 900 || true
            adb shell input text 1234 || true
            adb shell input tap 540 980 || true
            sleep 3
            adb exec-out screencap -p > preview/02-home.png
      - name: رفع صور المعاينة
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-preview-screenshots
          path: preview/*.png
          if-no-files-found: error
