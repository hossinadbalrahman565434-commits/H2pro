name: بناء واختبار تطبيق H2pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: h2pro-main-build
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v5
      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: بناء APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --console=plain
      - name: التحقق من APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  accounting-test:
    name: اختبار الدورة المحاسبية
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v5
      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: اختبار الدورة على محاكي ثابت
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 4
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon --console=plain
      - name: رفع تشخيص الاختبارات عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-test-diagnostics
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
