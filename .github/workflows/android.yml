name: بناء ومعاينة تطبيق H2pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: إصلاح صياغة Kotlin قبل البناء
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/h2pro/accounting/AccountingDb.kt')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('):List<String>=', '):List<String> ='),
              ('):List<Account>=', '):List<Account> ='),
          ]:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: بناء APK
        run: gradle :app:assembleDebug --stacktrace
      - name: التحقق من APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  accounting-test:
    name: اختبار الدورة المحاسبية
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: تفعيل AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
      - name: تشغيل اختبارات الدورة على المحاكي بثبات
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set -e
            echo 'انتظار اتصال ADB وإقلاع Android بالكامل...'
            adb wait-for-device
            for i in $(seq 1 60); do
              booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
              if [ "$booted" = "1" ]; then break; fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            echo 'تشغيل الاختبار مع إعادة المحاولة عند انقطاع ADB...'
            for attempt in 1 2 3; do
              echo "محاولة الاختبار $attempt/3"
              adb wait-for-device
              if gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon; then
                echo 'نجح اختبار الدورة المحاسبية.'
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo 'فشل مؤقت؛ إعادة تهيئة ADB والمحاولة مرة أخرى...'
                adb kill-server || true
                adb start-server
                sleep 5
                adb wait-for-device
              fi
            done
            echo 'فشل اختبار الدورة بعد 3 محاولات.'
            exit 1

  preview:
    name: معاينة التطبيق قبل التثبيت
    needs: [build, accounting-test]
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4
      - name: تنزيل APK
        uses: actions/download-artifact@v4
        with:
          name: H2pro-debug-apk
          path: apk
      - name: تشغيل محاكي Android والتقاط المعاينة
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r apk/app-debug.apk
            adb shell am force-stop com.h2pro.accounting
            adb shell monkey -p com.h2pro.accounting 1
            sleep 5
            mkdir -p preview
            adb exec-out screencap -p > preview/01-login.png
            adb shell input tap 540 820 || true
            adb shell input text 1 || true
            adb shell input tap 540 900 || true
            adb shell input text 1234 || true
            adb shell input tap 540 980 || true
            sleep 3
            adb exec-out screencap -p > preview/02-home.png
      - name: رفع صور المعاينة
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-preview-screenshots
          path: preview/*.png
          if-no-files-found: error
