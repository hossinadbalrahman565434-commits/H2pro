name: Build H2pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: إعداد مشروع Android
        run: |
          cd "برنامج"
          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = "H2pro"\ninclude(":app")\n' > settings.gradle.kts

      - name: بناء APK
        run: |
          cd "برنامج"
          gradle assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: H2pro-debug
          path: "برنامج/app/build/outputs/apk/debug/app-debug.apk"
